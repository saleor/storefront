query CurrentUserOrdersPaginated($first: Int, $after: String, $languageCode: LanguageCodeEnum!) {
	me {
		...UserDetails
		orders(first: $first, after: $after) {
			edges {
				node {
					...OrderDetails
					channel {
						slug
					}
					lines {
						productName
						variantName
					}
				}
				cursor
			}
			pageInfo {
				hasNextPage
				endCursor
			}
			totalCount
		}
	}
}
