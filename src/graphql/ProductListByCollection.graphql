query ProductListByCollection(
	$slug: String!
	$channel: String!
	$languageCode: LanguageCodeEnum!
	$slugLanguageCode: LanguageCodeEnum
	$first: Int
	$after: String
	$last: Int
	$before: String
	$sortBy: ProductOrder
	$filter: ProductFilterInput
	$where: ProductWhereInput
) {
	collection(slug: $slug, channel: $channel, slugLanguageCode: $slugLanguageCode) {
		...CollectionDetailsExtension
		id
		name
		slug
		description
		seoDescription
		seoTitle
		translation(languageCode: $languageCode) {
			name
			description
			seoDescription
			seoTitle
			slug
		}
		...CollectionLocaleSlugTranslations
		# Full-bleed hero — see ProductListByCategory for why this must be sized.
		backgroundImage(size: 2048, format: WEBP) {
			url
			alt
		}
		products(
			first: $first
			after: $after
			last: $last
			before: $before
			sortBy: $sortBy
			filter: $filter
			where: $where
		) {
			edges {
				node {
					...ProductListItem
				}
				cursor
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
			}
			totalCount
		}
	}
}
