fragment Money on Money {
	currency
	amount
}

fragment OrderLineFragment on OrderLine {
	id
	quantity
	variant {
		name
		translation(languageCode: $languageCode) {
			name
		}
		product {
			name
			translation(languageCode: $languageCode) {
				name
			}
		}
		attributes(variantSelection: ALL) {
			values {
				name
				dateTime
				boolean
				translation(languageCode: $languageCode) {
					name
				}
			}
		}
	}
	totalPrice {
		gross {
			...Money
		}
	}
	undiscountedUnitPrice {
		gross {
			...Money
		}
	}
	unitPrice {
		gross {
			...Money
		}
	}
	productName
	variantName
	thumbnail(size: 128, format: WEBP) {
		alt
		url
	}
}

fragment ShippingFragment on ShippingMethod {
	name
	minimumDeliveryDays
	maximumDeliveryDays
}

fragment OrderFulfillmentFragment on Fulfillment {
	id
	status
	trackingNumber
}

fragment OrderFragment on Order {
	id
	number
	created
	status
	statusDisplay
	userEmail
	isPaid
	channel {
		slug
	}
	discounts {
		type
		name
		amount {
			...Money
		}
	}
	chargeStatus
	authorizeStatus
	shippingAddress {
		...AddressFragment
	}
	billingAddress {
		...AddressFragment
	}
	deliveryMethod {
		...ShippingFragment
	}
	total {
		gross {
			...Money
		}
		tax {
			...Money
		}
	}
	shippingPrice {
		gross {
			...Money
		}
	}
	subtotal {
		gross {
			...Money
		}
	}
	lines {
		...OrderLineFragment
	}
	totalBalance {
		...Money
	}
	totalCaptured {
		...Money
	}
	fulfillments {
		...OrderFulfillmentFragment
	}
}

query order($id: ID!, $languageCode: LanguageCodeEnum!) {
	order(id: $id) {
		...OrderFragment
	}
}

query ordersByNumber($number: Int!, $languageCode: LanguageCodeEnum!) {
	orders(first: 1, where: { number: { eq: $number } }) {
		edges {
			node {
				...OrderFragment
			}
		}
	}
}
