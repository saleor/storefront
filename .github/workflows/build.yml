name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SALEOR_API_URL: https://storefront1.saleor.cloud/graphql/
      # storefront1 publishes its catalog in eu and uk; default-channel and aud are empty.
      NEXT_PUBLIC_DEFAULT_CHANNEL: eu
      STOREFRONT_CHANNELS: eu,uk
      CONTENT_PROVIDER: saleor

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bootstrap agent skills
        run: pnpm skills:bootstrap
      - name: paper doctor (agent setup healthy)
        run: pnpm run doctor:check
      - name: Verify agent docs (frontmatter + AGENTS.md in sync)
        run: pnpm run docs:check
      - name: Data-layer and core locks
        run: pnpm run data:lock:check && pnpm run core:lock:check
      - name: Design tokens
        run: pnpm run lint:design-tokens
      - name: Forbid deprecated Product.variants in storefront GraphQL
        run: pnpm run lint:graphql-variants
      - name: Lint
        run: pnpm run lint
      - name: Guardrail canaries (each data-layer rule still fires)
        run: pnpm run guardrails:canary
      - name: Typecheck
        run: pnpm run typecheck
      # docs:check above runs before codegen and skips src/gql/ paths; typecheck has generated them now.
      - name: Doc paths into generated code
        run: node scripts/check-doc-paths.mjs
        env:
          DOC_PATHS_REQUIRE_GENERATED: "1"
      - name: Test
        run: pnpm run test:run
      - name: Build
        run: |
          set -o pipefail
          pnpm run build | tee build-output.txt
          node scripts/check-route-symbols.mjs build-output.txt
      # ◐ only proves a fallback shell exists. A shell that no longer resumes (a clock read
      # during prerender, data that differs at request time) still builds ◐ and then renders
      # an empty nav or <main> in the browser. This starts the app and fails on that.
      - name: PPR resume check
        run: pnpm run check:ppr-resume
      # These specs prove the PDP and category shells carry the title inside instant().
      # They browse NEXT_PUBLIC_DEFAULT_CHANNEL, which needs products (more than one page).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Instant navigation and PLP e2e
        run: pnpm exec playwright test e2e/instant-navigation.spec.ts e2e/plp-filters.spec.ts
