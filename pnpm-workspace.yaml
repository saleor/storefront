blockExoticSubdeps: true
minimumReleaseAge: 1440 # 24h
minimumReleaseAgeExclude:
  # Fresh Next patches on this branch — allow install before the 24h age gate
  - next
  - "@next/*"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
overrides:
  graphql: 16.8.1
  dset: ">=3.1.4"
  micromatch: ">=4.0.8"
  "@babel/runtime": ">=7.26.10"
  "@babel/helpers": ">=7.26.10"
  "brace-expansion@>=2": ">=2.0.2"
  next: 16.3.0
